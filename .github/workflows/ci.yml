# Public library: native checks must remain resolvable without private workflows.
# One Linux context retains every original unit, API and registration-route assertion.
# Required per-suite execution floors are a finite template deviation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.26'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.11
      - name: Install
        timeout-minutes: 10
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run pyright src/stromy_byok
      - name: Unit tests
        run: |
          rm -f .unit-junit.xml
          uv run pytest tests/unit -v --junitxml=.unit-junit.xml
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step tests --suite unit --report .unit-junit.xml --returncode 0
      - name: Contract tests
        run: |
          rm -f .contract-junit.xml
          uv run pytest tests/contract -v --junitxml=.contract-junit.xml
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step contract --suite contract --report .contract-junit.xml --returncode 0
      - name: Integration tests (registration routes)
        # Required local ASGI transactions; no provider or cloud request.
        run: |
          rm -f .pytest_cache/routes-junit.xml
          uv run pytest tests/integration -v -ra --junitxml=.pytest_cache/routes-junit.xml
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step tests --suite routes --report .pytest_cache/routes-junit.xml --returncode 0
      - run: uv lock --check
      - run: uv build
