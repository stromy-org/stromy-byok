# Self-contained on purpose — do NOT convert this back to a call into
# `stromy-org/stromy-org/.github/workflows/ci-python.yml`.
#
# Every other Python satellite calls that shared reusable workflow, and this repo
# did too until it went public (2026-08-16). The control plane that hosts the
# shared workflow is PRIVATE and this repo is PUBLIC, so the call stops resolving
# the moment visibility flips: runs fail at 0s with a startup error and no jobs
# at all. That is not a hypothesis — the first re-run after the flip failed
# exactly that way, with `conclusion=startup_failure` and `jobs=0`.
#
# Inlining is the right shape regardless of the mechanics: a public library must
# be buildable from its own contents by anyone who clones it. Proving a public
# package correct via a private workflow is a dependency its own consumers cannot
# satisfy. This repo went public so the public facade
# `stromy-org/stromy-workflows-mcp` can resolve it without private-build
# credentials — shipping it with a private-only CI would have re-created the same
# problem one level down.
#
# The cost is real and accepted: this file must be kept in step with
# ci-python.yml by hand. Keep it minimal so that stays cheap — this repo has no
# private git+URL dependencies, so the App-token minting the shared workflow
# spends a job on has nothing to do here.
#
# `asset-transport` carries the same file and the same warning, for the same
# reason. If you are about to "restore" the reusable call in either, read this.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv python install 3.11
      # `--all-extras` installs [azure], so pyright type-checks the Key Vault
      # backend instead of skipping it as an unresolved import — that backend is
      # the one this package cannot afford to leave unchecked. Unlike
      # asset-transport, this repo's `dev` group does NOT pull the extra in, so
      # the flag is what makes the difference.
      #
      # `--locked` is load-bearing, not tidiness: a bare `uv sync` SILENTLY
      # RELOCKS when pyproject.toml and uv.lock disagree, so CI goes green
      # against a lockfile it regenerated and threw away, and the committed one
      # is never asserted. Both flags mirror the shared ci-python.yml.
      - run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run pyright src/stromy_byok

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv python install 3.11
      - run: uv sync --locked --all-extras
      - name: Tests
        run: uv run pytest
