# Build a sdist+wheel on tag push and attach them to a GitHub Release.
#
# Workflow:
#   1. Bump version in pyproject.toml on main.
#   2. git tag vX.Y.Z && git push --tags
#   3. This workflow builds + publishes the release.
#
# Consumers depend on a specific tag via:
#   "<pkg> @ git+https://github.com/stromy-org/stromy-byok.git@vX.Y.Z"
# so the GitHub Release artifacts are informational — uv reads the source tree
# at the tagged commit directly. The release page is the human-facing audit
# trail and changelog anchor.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Refuse to publish a tag that is not reachable from main (ORG-PLAN-209).
  #
  # `verify tag matches pyproject version` proves the tag is *self-consistent*, not
  # that its commit was ever reviewed or CI-gated: `git tag v9.9.9` on a side branch
  # with a matching pyproject bump passes it and publishes. Consumers pin exact tags
  # via [tool.uv.sources], so a tag is the immutable artifact — it cannot be walked
  # back once a consumer has resolved it.
  #
  # This is its own JOB, not a step, so every downstream job (build, GitHub Release,
  # consumer-bump dispatch) is gated by `needs:` and no release side effect can run
  # ahead of it. `fetch-depth: 0` is load-bearing — ancestry is unprovable on the
  # default shallow checkout, and a shallow `merge-base` would fail open-ish/noisily
  # rather than answer the question.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a tag that is not reachable from main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of origin/main."
            echo "::error::Merge the work to main before tagging — a release must ship reviewed, CI-gated code."
            exit 1
          fi

  build-and-release:
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Build distributions
        run: uv build
      - name: Verify tag matches pyproject version
        run: |
          PYPROJECT_VERSION="$(uv run python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${PYPROJECT_VERSION}"
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rerun-safe. `gh release create` fails outright when the tag
          # already has a release, so a re-run after a transient failure in a
          # LATER step (the consumer-bump token mint, a network blip) could not
          # get past this one — the operator's only route was to delete the
          # release by hand first. Nothing about that protects anything: the tag
          # is already asserted to match pyproject above, so re-uploading the
          # same artifacts is idempotent.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists — refreshing its assets."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi

      # NO auto-bump dispatch here, deliberately (ORG-296, 2026-09-13).
      #
      # This step used to fire `repository_dispatch` at a hand-written list of
      # consumer repos. `POST /dispatches` returns 204 whether or not anything
      # listens, so the list could rot in silence — and it had: the receiver
      # existed in one repo, five named targets had none, and eight real
      # consumers were named by no sender at all.
      #
      # Pins are now reconciled centrally by stromy-org's
      # .github/workflows/internal-lib-pins.yml, which DERIVES the consumer
      # graph from every repo's own [tool.uv.sources] each run and opens the
      # bump PRs. Nothing here needs to know who consumes this library.
      #
      # Re-adding a fan-out is gated: `internal-lib-pins.py --check` fails on a
      # dispatch aimed at a repo with no receiver.
